<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Singles Catalogue - Search</title>
<style>
  :root {
    --bg: #f2f7fc;
    --surface: #ffffff;
    --surface-2: #e6f0fa;
    --text: #1b2733;
    --muted: #55677a;
    --line: #d3e1ee;
    --accent: #3a96d4;
    --chip-bg: #cfe6f8;
    --chip-text: #12202e;
    --primary: #1d4f91;
    --primary-text: #ffffff;
    --link: #1d4f91;
    --mark: #ffe58f;
    --mark-text: #1b2733;
    --focus: #1d5fd1;
    --shadow: 0 1px 2px rgba(27, 39, 51, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1822;
      --surface: #17222f;
      --surface-2: #1f2d3d;
      --text: #e8eef5;
      --muted: #9db0c3;
      --line: #2b3b4e;
      --accent: #5aaee6;
      --chip-bg: #24415c;
      --chip-text: #e8eef5;
      --primary: #2f6fc4;
      --link: #8fc3f0;
      --mark: #6b5a14;
      --mark-text: #fff6d6;
      --focus: #7aa7ff;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; letter-spacing: -.01em; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  .search { position: relative; }
  .search input {
    width: 100%; font: inherit; font-size: 1.1rem; padding: 14px 44px 14px 16px;
    color: var(--text); background: var(--surface); border: 1px solid var(--line);
    border-radius: 12px; box-shadow: var(--shadow);
  }
  .search input::-webkit-search-cancel-button { display: none; }
  .search .clear {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    width: 32px; height: 32px; border: 0; border-radius: 50%; cursor: pointer;
    background: var(--surface-2); color: var(--muted); font-size: 1.1rem; line-height: 1;
  }
  .search .clear[hidden] { display: none; }

  .filters { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; margin: 14px 0 6px; }
  .filters label { display: grid; gap: 3px; font-size: .85rem; color: var(--muted); }
  .filters select {
    font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; min-width: 150px;
  }
  .check { display: flex !important; grid-auto-flow: column; align-items: center; gap: 8px !important; padding: 9px 0; }
  .check input { width: 18px; height: 18px; }
  .btn {
    font: inherit; cursor: pointer; padding: 8px 14px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--surface); color: var(--text);
  }
  .btn:hover { background: var(--surface-2); }

  .stats { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 14px 0; color: var(--muted); font-size: .92rem; }
  .stats strong { color: var(--text); }

  .list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; box-shadow: var(--shadow); display: flex; gap: 14px; align-items: flex-start;
  }
  .card .body { display: grid; gap: 6px; flex: 1 1 auto; min-width: 0; }
  .art {
    flex: 0 0 auto; width: 76px; height: 76px; border-radius: 8px; overflow: hidden;
    background: var(--surface-2); color: var(--muted); border: 1px solid var(--line);
    display: grid; place-items: center; font-size: 1.8rem; user-select: none;
  }
  .art img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .card .head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; align-items: baseline; }
  .card h2 { margin: 0; font-size: 1.1rem; overflow-wrap: anywhere; }
  .card .artist { color: var(--muted); overflow-wrap: anywhere; }
  .card .artist button {
    font: inherit; padding: 0; border: 0; background: none; cursor: pointer;
    color: var(--link); text-decoration: underline; text-underline-offset: 2px;
  }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: .8rem; padding: 2px 10px; border-radius: 999px;
    background: var(--chip-bg); color: var(--chip-text); border: 0; font-family: inherit;
  }
  button.chip { cursor: pointer; }
  button.chip:hover { filter: brightness(.95); }
  .chip.plain { background: var(--surface-2); color: var(--muted); }
  .notes { margin: 0; overflow-wrap: anywhere; }
  .notes.empty { color: var(--muted); font-style: italic; }
  .listen { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-top: 2px; font-size: .88rem; }
  .play {
    font: inherit; font-size: .88rem; cursor: pointer; padding: 5px 14px; border-radius: 999px;
    border: 0; background: var(--primary); color: var(--primary-text);
  }
  .play:hover { filter: brightness(1.1); }
  .play:disabled { opacity: .7; cursor: progress; }
  .play.on { background: var(--accent); color: #0f1822; }
  .listen .status { color: var(--muted); }
  .listen a { color: var(--link); text-underline-offset: 2px; }
  mark { background: var(--mark); color: var(--mark-text); border-radius: 3px; padding: 0 1px; }

  .none { text-align: center; color: var(--muted); padding: 36px 12px; background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; }
  footer { margin-top: 28px; color: var(--muted); font-size: .85rem; }
  @media (max-width: 520px) { .card { gap: 10px; padding: 12px; } .art { width: 56px; height: 56px; font-size: 1.4rem; } .filters select { min-width: 0; width: 100%; } .filters label { flex: 1 1 140px; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Singles Catalogue - Search</h1>
  <p class="sub">Search my singles by artist, track, genre or notes.</p>

  <div class="search">
    <input id="q" type="search" placeholder="Search artist or track…  (press / to jump here)" aria-label="Search artist or track" autocomplete="off" spellcheck="false">
    <button class="clear" id="clearQ" type="button" aria-label="Clear search" hidden>&times;</button>
  </div>

  <div class="filters">
    <label>Genre <select id="genre"><option value="">All genres</option></select></label>
    <label>Decade <select id="decade"><option value="">All years</option></select></label>
    <label>Sort by
      <select id="sort">
        <option value="cat">Catalogue number</option>
        <option value="artist">Artist (A-Z)</option>
        <option value="title">Track (A-Z)</option>
        <option value="yearAsc">Year (oldest first)</option>
        <option value="yearDesc">Year (newest first)</option>
      </select>
    </label>
    <label class="check"><input id="needs" type="checkbox"> Only singles with no notes yet</label>
    <button class="btn" id="reset" type="button">Reset</button>
  </div>

  <div class="stats" id="stats" aria-live="polite"></div>
  <ul class="list" id="results"></ul>

  <footer id="foot"></footer>
</div>

<script src="data.js"></script>
<script>
(function () {
  'use strict';
  var DATA = Array.isArray(window.SINGLES) ? window.SINGLES : [];
  var $ = function (id) { return document.getElementById(id); };
  var els = { q: $('q'), clearQ: $('clearQ'), genre: $('genre'), decade: $('decade'),
              sort: $('sort'), needs: $('needs'), reset: $('reset'),
              stats: $('stats'), results: $('results'), foot: $('foot') };

  // Lower-case and strip accents/punctuation so "Smalltown Boy" finds "small-town boy" etc.
  function norm(s) {
    return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/&/g, ' and ').replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function decadeOf(y) { return y ? Math.floor(y / 10) * 10 : null; }

  DATA.forEach(function (r) {
    r._hay = norm([r.artist, r.aka, r.title, r.genre, r.notes, r.year, r.cat].join(' '));
    r._artist = norm((r.artist || '') + ' ' + (r.aka || ''));
    r._title = norm(r.title);
  });

  // Fill the genre and decade drop-downs from the data. Genres are split on " / "
  // so "Synth-pop / Hi-NRG" appears under both.
  function genresOf(r) {
    return (r.genre || '').split('/').map(function (g) { return g.trim(); }).filter(Boolean);
  }
  var genreSet = {}, decSet = {};
  DATA.forEach(function (r) {
    genresOf(r).forEach(function (g) { genreSet[g] = (genreSet[g] || 0) + 1; });
    var d = decadeOf(r.year); if (d) decSet[d] = (decSet[d] || 0) + 1;
  });
  Object.keys(genreSet).sort(function (a, b) { return a.localeCompare(b); }).forEach(function (g) {
    els.genre.insertAdjacentHTML('beforeend', '<option value="' + esc(g) + '">' + esc(g) + ' (' + genreSet[g] + ')</option>');
  });
  Object.keys(decSet).sort().forEach(function (d) {
    els.decade.insertAdjacentHTML('beforeend', '<option value="' + d + '">' + d + 's (' + decSet[d] + ')</option>');
  });

  // Highlight every search word inside already-escaped text.
  function highlight(text, words) {
    var safe = esc(text);
    if (!words.length) return safe;
    var re = new RegExp('(' + words.map(function (w) { return w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }).join('|') + ')', 'ig');
    return safe.replace(re, '<mark>$1</mark>');
  }

  var SORTS = {
    cat: function (a, b) { return a.cat - b.cat; },
    artist: function (a, b) { return a._artist.localeCompare(b._artist) || a._title.localeCompare(b._title); },
    title: function (a, b) { return a._title.localeCompare(b._title) || a._artist.localeCompare(b._artist); },
    yearAsc: function (a, b) { return (a.year || 9999) - (b.year || 9999) || a.cat - b.cat; },
    yearDesc: function (a, b) { return (b.year || 0) - (a.year || 0) || a.cat - b.cat; }
  };

  function render() {
    var q = norm(els.q.value);
    var words = q ? q.split(' ') : [];
    var g = els.genre.value, d = els.decade.value, needs = els.needs.checked;

    var rows = DATA.filter(function (r) {
      if (g && genresOf(r).indexOf(g) < 0) return false;
      if (d && String(decadeOf(r.year)) !== d) return false;
      if (needs && r.notes) return false;
      return words.every(function (w) { return r._hay.indexOf(w) >= 0; });
    }).sort(SORTS[els.sort.value] || SORTS.cat);

    els.clearQ.hidden = !els.q.value;
    var shown = rows.length === DATA.length ? 'all <strong>' + rows.length + '</strong> singles'
                                            : '<strong>' + rows.length + '</strong> of ' + DATA.length + ' singles';
    var artists = {}; rows.forEach(function (r) { artists[r._artist] = 1; });
    els.stats.innerHTML = '<span>Showing ' + shown + '</span><span><strong>' + Object.keys(artists).length + '</strong> artists</span>';

    if (!rows.length) {
      els.results.innerHTML = '<li class="none">No singles match. Try fewer words, or press Reset.</li>';
      return;
    }
    els.results.innerHTML = rows.map(function (r) {
      var gen = genresOf(r).map(function (x) {
        return '<button class="chip" type="button" data-genre="' + esc(x) + '" title="Show only ' + esc(x) + '">' + esc(x) + '</button>';
      }).join('');
      var yr = r.year ? '<button class="chip" type="button" data-decade="' + decadeOf(r.year) + '" title="Show the ' + decadeOf(r.year) + 's">' + r.year + '</button>' : '';
      var also = r.aka ? ' <span class="chip plain" title="Corrected spelling">' + esc(r.aka) + '</span>' : '';
      var notes = r.notes ? '<p class="notes">' + highlight(r.notes, words) + '</p>'
                          : '<p class="notes empty">No notes yet.</p>';
      return '<li class="card">' + artHtml(r) + '<div class="body"><div class="head"><h2>' + highlight(r.title, words) + '</h2>' +
             '<span class="chip plain">Cat. ' + r.cat + '</span></div>' +
             '<div class="artist"><button type="button" data-artist="' + esc(r.artist) + '" title="Search this artist">' +
             highlight(r.artist, words) + '</button>' + also + '</div>' +
             '<div class="meta">' + yr + gen + '</div>' + notes + listenRow(r) + '</div></li>';
    }).join('');
    syncPlayButtons();
    observeArt();
  }

  // ---- Cover art --------------------------------------------------------
  // Each card shows a small cover from the same iTunes lookup the Preview button uses. Art is only
  // fetched for cards that are on screen, one request every few seconds (Apple limits how fast a
  // browser may ask), and remembered in this browser so it is only ever fetched once.
  var ART_KEY = 'singles-art-v1';
  var artStore = {};          // artKey -> image URL, or '' when Apple has no match
  try { artStore = JSON.parse(localStorage.getItem(ART_KEY) || '{}') || {}; } catch (e) { artStore = {}; }
  var byCat = {}; DATA.forEach(function (r) { byCat[r.cat] = r; });

  function artKey(r) { return r.cat + '|' + norm(r.artist + ' ' + r.title); }
  function hasArt(r) { return Object.prototype.hasOwnProperty.call(artStore, artKey(r)); }
  function artFrom(x) {
    var u = x && x.artworkUrl100 ? String(x.artworkUrl100).replace('100x100bb', '200x200bb') : '';
    return /^https:\/\/[a-z0-9.-]*mzstatic\.com\//.test(u) ? u : '';
  }
  function artInner(url) { return url ? '<img src="' + esc(url) + '" alt="" loading="lazy">' : '&#9835;'; }
  function artHtml(r) {
    var done = hasArt(r);
    return '<div class="art" data-art="' + r.cat + '"' + (done ? ' data-done="1"' : '') + ' aria-hidden="true">' +
           artInner(done ? artStore[artKey(r)] : '') + '</div>';
  }
  function rememberArt(r, url) {
    artStore[artKey(r)] = url || '';
    try { localStorage.setItem(ART_KEY, JSON.stringify(artStore)); } catch (e) {}
    var el = els.results.querySelector('.art[data-art="' + r.cat + '"]');
    if (el) { el.dataset.done = '1'; el.innerHTML = artInner(url); }
  }
  // A cover that fails to load falls back to the music-note placeholder.
  els.results.addEventListener('error', function (e) {
    if (e.target.tagName === 'IMG' && e.target.parentNode) e.target.parentNode.innerHTML = '&#9835;';
  }, true);

  var visible = {}, queue = [], retries = {}, artBusy = false;
  var observer = 'IntersectionObserver' in window ? new IntersectionObserver(function (entries) {
    entries.forEach(function (en) {
      var cat = Number(en.target.dataset.art);
      if (en.isIntersecting) { visible[cat] = true; if (queue.indexOf(cat) < 0) queue.push(cat); }
      else delete visible[cat];
    });
    pumpArt();
  }, { rootMargin: '150px' }) : null;

  function observeArt() {
    if (!observer) return;
    observer.disconnect(); visible = {}; queue = [];
    Array.prototype.forEach.call(els.results.querySelectorAll('.art:not([data-done])'), function (el) { observer.observe(el); });
  }
  function pumpArt() {
    if (artBusy) return;
    var r = null;
    while (queue.length && !r) {
      var c = queue.shift();
      if (visible[c] && byCat[c] && !hasArt(byCat[c])) r = byCat[c];
    }
    if (!r) return;
    artBusy = true;
    var wait = 3200;
    lookup(r).catch(function (err) {
      retries[r.cat] = (retries[r.cat] || 0) + 1;
      if (retries[r.cat] <= 2) queue.push(r.cat);                  // try again later, never cache a failure
      wait = err && (err.status === 403 || err.status === 429) ? 60000 : 8000;
    }).then(function () {
      setTimeout(function () { artBusy = false; pumpArt(); }, wait);
    });
  }

  // ---- Song previews ----------------------------------------------------
  // Clicking Preview asks Apple's free iTunes Search API for the track and plays the
  // 30-second clip it returns. Results are remembered so each song is only looked up once.
  var player = new Audio();
  player.preload = 'none';
  var previews = {};          // cat -> { url, name } on a match, or null for "no match"
  var playingCat = null;      // cat number of the clip that is loaded
  var loadingCat = null;      // cat number being looked up right now
  var failedCats = {};        // cat -> true when no preview could be found

  function searchLinks(r) {
    var term = encodeURIComponent(r.artist + ' ' + r.title);
    return '<a href="https://www.youtube.com/results?search_query=' + term + '" target="_blank" rel="noopener">YouTube</a>' +
           '<a href="https://open.spotify.com/search/' + term + '" target="_blank" rel="noopener">Spotify</a>';
  }
  function listenRow(r) {
    return '<div class="listen" data-cat="' + r.cat + '">' +
           '<button class="play" type="button" data-play="' + r.cat + '" aria-label="Play a 30 second preview of ' + esc(r.title) + ' by ' + esc(r.artist) + '">&#9654; Preview</button>' +
           '<span class="status" aria-live="polite"></span>' +
           '<span class="status">Find it on:</span>' + searchLinks(r) + '</div>';
  }

  // Words that rarely help matching, and result names that are covers rather than the record.
  var STOP = { the: 1, and: 1, a: 1, of: 1 };
  var COVER = /karaoke|tribute|made famous|originally performed|in the style of|cover|instrumental|\blive\b/i;
  function words(s) { return norm(s).split(' ').filter(function (w) { return w && !STOP[w]; }); }
  function baseTitle(s) { return norm(String(s || '').replace(/[\(\[].*?[\)\]]/g, ' ')); }

  // Pick the best Apple result for a single, or null if nothing looks like the right record.
  function pickMatch(r, results) {
    var want = baseTitle(r.title);
    var artistWords = words(r.artist + ' ' + (r.aka || ''));
    var best = null, bestScore = 0;
    (results || []).forEach(function (x, i) {
      if (!x.trackName) return;
      var got = baseTitle(x.trackName);
      var gotArtist = norm(x.artistName);
      if (got !== want && got.indexOf(want) !== 0) return;               // title must match
      var hits = artistWords.filter(function (w) { return gotArtist.indexOf(w) >= 0; }).length;
      if (!hits) return;                                                  // and so must some of the artist
      var score = 10 + hits / artistWords.length * 10 - i * 0.1;
      if (got === want) score += 5;
      if (x.previewUrl) score += 3;
      if (COVER.test(x.trackName + ' ' + (x.collectionName || ''))) score -= 8;
      if (score > bestScore) { bestScore = score; best = x; }
    });
    return best ? { url: best.previewUrl || '', name: best.trackName + ' - ' + best.artistName, art: artFrom(best) } : null;
  }

  var inflight = {};          // cat -> promise, so a click and the artwork queue share one request
  function lookup(r) {
    if (previews.hasOwnProperty(r.cat)) return Promise.resolve(previews[r.cat]);
    if (inflight[r.cat]) return inflight[r.cat];
    var url = 'https://itunes.apple.com/search?media=music&entity=song&limit=15&country=GB&term=' +
              encodeURIComponent(r.artist + ' ' + r.title);
    return (inflight[r.cat] = fetch(url).then(function (res) {
      if (!res.ok) { var e = new Error('HTTP ' + res.status); e.status = res.status; throw e; }
      return res.json();
    }).then(function (json) {
      var p = previews[r.cat] = pickMatch(r, json.results);
      delete inflight[r.cat];
      rememberArt(r, p && p.art);
      return p;
    }, function (err) {
      delete inflight[r.cat];
      throw err;
    }));
  }

  // Make every Preview button on screen reflect what is happening (the list is redrawn on each search).
  function syncPlayButtons() {
    Array.prototype.forEach.call(els.results.querySelectorAll('.play'), function (b) {
      var cat = Number(b.dataset.play);
      var on = cat === playingCat && !player.paused;
      b.classList.toggle('on', on);
      b.disabled = cat === loadingCat;
      b.innerHTML = cat === loadingCat ? 'Loading&hellip;' : on ? '&#9208; Pause' : '&#9654; Preview';
      b.parentNode.querySelector('.status').textContent =
        failedCats[cat] ? 'No preview available - try a link instead.' : on ? 'Playing a 30 second clip' : '';
    });
  }

  function togglePlay(cat) {
    var r = DATA.filter(function (x) { return x.cat === cat; })[0];
    if (!r) return;
    if (playingCat === cat) {                       // same song: pause / resume
      if (player.paused) player.play(); else player.pause();
      return;
    }
    player.pause();
    playingCat = null;
    loadingCat = cat;
    delete failedCats[cat];
    syncPlayButtons();
    lookup(r).then(function (p) {
      if (loadingCat !== cat) return;               // the user clicked something else meanwhile
      loadingCat = null;
      if (!p || !p.url) { failedCats[cat] = true; syncPlayButtons(); return; }
      player.src = p.url;
      playingCat = cat;
      return player.play().then(function () { syncPlayButtons(); });
    }).catch(function () {
      if (loadingCat === cat) loadingCat = null;
      playingCat = null;
      failedCats[cat] = true;
      syncPlayButtons();
    });
  }
  ['play', 'pause', 'ended'].forEach(function (ev) {
    player.addEventListener(ev, function () {
      if (ev === 'ended') playingCat = null;
      syncPlayButtons();
    });
  });

  // Click an artist, genre or year on a card to filter by it.
  els.results.addEventListener('click', function (e) {
    var t = e.target.closest('button'); if (!t) return;
    if (t.dataset.play) { togglePlay(Number(t.dataset.play)); return; }
    if (t.dataset.artist) { els.q.value = t.dataset.artist; }
    else if (t.dataset.genre) { els.genre.value = t.dataset.genre; }
    else if (t.dataset.decade) { els.decade.value = t.dataset.decade; }
    else return;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // The text box redraws on 'input' only. A 'change' event also fires when it loses focus,
  // and that redraw would swallow a click on a card button the moment you press it.
  els.q.addEventListener('input', render);
  [els.genre, els.decade, els.sort, els.needs].forEach(function (el) {
    el.addEventListener('change', render);
  });
  els.clearQ.addEventListener('click', function () { els.q.value = ''; render(); els.q.focus(); });
  els.reset.addEventListener('click', function () {
    els.q.value = ''; els.genre.value = ''; els.decade.value = '';
    els.sort.value = 'cat'; els.needs.checked = false; render(); els.q.focus();
  });
  document.addEventListener('keydown', function (e) {
    var tag = (document.activeElement && document.activeElement.tagName) || '';
    if (e.key === '/' && !/INPUT|SELECT|TEXTAREA/.test(tag)) { e.preventDefault(); els.q.focus(); }
  });

  els.foot.textContent = DATA.length + ' singles in the catalogue.';
  render();
})();
</script>
</body>
</html>
